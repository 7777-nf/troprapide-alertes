<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant — TropRapide</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#161616;--border:#242424;--yellow:#F5C800;--green:#22C55E;--red:#EF4444;--orange:#F97316;--blue:#3B82F6;--text:#F5F5F0;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}

/* CONFIG */
.cfg{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.cfg-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:420px;}
.cfg-logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:900;color:var(--yellow);text-align:center;margin-bottom:4px;}
.cfg-sub{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:22px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fg input,.fg select{background:#1a1a1a;border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:.9rem;outline:none;transition:border-color .2s;width:100%;font-family:'DM Sans',sans-serif;}
.fg input:focus,.fg select:focus{border-color:var(--yellow);}
.fg select option{background:#1a1a1a;}
.btn-cfg{width:100%;padding:13px;background:var(--yellow);color:#000;border:none;border-radius:10px;font-size:.95rem;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;margin-top:4px;}

/* HEADER */
.header{padding:14px 20px;background:#0a0a0a;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{font-size:1.8rem;}
.brand-name{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:900;color:var(--yellow);}
.brand-sub{font-size:.72rem;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:10px;}
.clock{color:var(--muted);font-size:.88rem;}
.open-btn{padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer;border:none;font-size:.82rem;}
.open-btn.open{background:var(--green);color:#fff;}
.open-btn.closed{background:var(--red);color:#fff;}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.78rem;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;background:#060606;border-bottom:1px solid var(--border);}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);text-align:center;}
.stat-val{font-size:1.6rem;font-weight:900;margin-bottom:2px;}
.stat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

/* TABS */
.tabs{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);background:#080808;overflow-x:auto;}
.tab{padding:11px 16px;border-radius:20px;font-size:.82rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);white-space:nowrap;transition:all .2s;min-height:44px;display:flex;align-items:center;}
.tab.active{background:var(--yellow);color:#000;border-color:var(--yellow);}

/* ORDERS GRID */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px 20px;}

/* ORDER CARD */
.order-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;transition:border-color .2s;}
.order-card.nouvelle{border-left:4px solid var(--orange);}
.order-card.acceptee{border-left:4px solid var(--blue);}
.order-card.prete{border-left:4px solid var(--yellow);}
.order-card.en-route{border-left:4px solid var(--green);opacity:.7;}
.order-card.new-flash{animation:flash .5s ease;}
@keyframes flash{0%,100%{background:var(--card)}50%{background:#1a1400;}}

.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-id{font-family:'Syne',sans-serif;font-weight:900;font-size:.95rem;color:var(--yellow);}
.order-time{font-size:.7rem;color:var(--muted);margin-top:2px;}
.status-badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.s-nouvelle{background:#1a0a00;color:var(--orange);}
.s-acceptee{background:#00001a;color:var(--blue);}
.s-prete{background:#1a1500;color:var(--yellow);}
.s-en-route{background:#001a0a;color:var(--green);}

.order-items{font-size:.88rem;font-weight:600;margin-bottom:8px;padding:10px;background:#0a0a0a;border-radius:8px;line-height:1.5;}
.order-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.meta-chip{background:#1a1a1a;padding:3px 9px;border-radius:20px;font-size:.72rem;}

.urgent-badge{background:#1a0000;color:var(--red);padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-block;margin-bottom:8px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

.order-actions{display:flex;gap:8px;}
.act-btn{flex:1;padding:13px 10px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:.82rem;font-family:'Syne',sans-serif;transition:opacity .2s;min-height:44px;}
.act-btn:active{opacity:.7;}
.btn-accept{background:var(--green);color:#fff;}
.btn-ready{background:var(--yellow);color:#000;}
.btn-cancel{background:#1a0000;border:1px solid #3a0000;color:var(--red);}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-ico{font-size:3rem;margin-bottom:12px;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;width:calc(100% - 32px);max-width:400px;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:10px;animation:tup .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.toast.s{border-left:3px solid var(--green)}.toast.e{border-left:3px solid var(--red)}.toast.w{border-left:3px solid var(--yellow)}
@keyframes tup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);}

/* ══ RESPONSIVE ══ */
@media(max-width:768px){
  .header{padding:11px 14px;flex-wrap:wrap;gap:8px;}
  .brand-name{font-size:1rem;}
  .open-btn{padding:10px 14px;min-height:44px;}
  .logout-btn{padding:10px 12px;min-height:44px;}
  .stats{padding:10px 14px;gap:8px;}
  .stat{padding:10px 8px;}
  .stat-val{font-size:1.4rem;}
  .tabs{padding:10px 14px;gap:6px;}
  .orders-grid{grid-template-columns:1fr;padding:12px 14px;gap:10px;}
  .order-card{padding:14px;}
  .order-actions{flex-direction:column;gap:6px;}
  .act-btn{width:100%;}
  .meta-chip{font-size:.75rem;padding:4px 10px;}
}
@media(max-width:480px){
  .header{padding:10px 12px;}
  .brand-logo{font-size:1.5rem;}
  .stat-lbl{font-size:.62rem;}
  .order-items{font-size:.85rem;}
  .tabs{padding:8px 12px;}
  .tab{padding:10px 12px;font-size:.78rem;}
}
</style>
</head>
<body>

<!-- CONFIG -->
<div class="cfg" id="cfgOverlay">
  <div class="cfg-card">
    <div class="cfg-logo">🍽️ RESTAURANT</div>
    <div class="cfg-sub">Connectez votre restaurant à TropRapide</div>
    <div class="fg"><label>Votre restaurant</label>
      <select id="cfg_resto">
        <option value="Mémé Choco">🍗 Mémé Choco</option>
        <option value="Le Palais du Poulet">🍗 Le Palais du Poulet</option>
        <option value="Saveurs du Soleil">🍲 Saveurs du Soleil</option>
        <option value="Pizza House Abidjan">🍕 Pizza House Abidjan</option>
        <option value="Street Burger Corner">🍔 Street Burger Corner</option>
        <option value="Délices Asiatiques">🍜 Délices Asiatiques</option>
        <option value="Juice &amp; Smoothies Bar">🥤 Juice &amp; Smoothies Bar</option>
      </select>
    </div>
    <div class="fg"><label>Firebase Database URL</label>
      <input type="text" id="cfg_db" placeholder="https://troprapide-xxx.firebaseio.com"></div>
    <div class="fg"><label>API Key</label>
      <input type="text" id="cfg_key" placeholder="AIzaSy..."></div>
    <div class="fg"><label>Project ID</label>
      <input type="text" id="cfg_pid" placeholder="troprapide-xxxxx"></div>
    <button class="btn-cfg" onclick="connect()">🔥 CONNECTER</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <span class="brand-logo">🍽️</span>
    <div>
      <div class="brand-name" id="restoName">Restaurant</div>
      <div class="brand-sub" id="todayDate"></div>
    </div>
  </div>
  <div class="header-right">
    <span class="clock" id="clock"></span>
    <button class="open-btn open" id="openBtn" onclick="toggleOpen()">🟢 OUVERT</button>
    <button class="logout-btn" onclick="logout()">⚙️ Config</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><div class="stat-val" id="s-new" style="color:var(--orange)">0</div><div class="stat-lbl">🔴 Nouvelles</div></div>
  <div class="stat"><div class="stat-val" id="s-kitchen" style="color:var(--blue)">0</div><div class="stat-lbl">🍳 En cuisine</div></div>
  <div class="stat"><div class="stat-val" id="s-ready" style="color:var(--yellow)">0</div><div class="stat-lbl">🟡 Prêtes</div></div>
  <div class="stat"><div class="stat-val" id="s-done" style="color:var(--green)">0</div><div class="stat-lbl">✅ Livrées</div></div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="setTab('active',this)">📋 En cours</div>
  <div class="tab" onclick="setTab('nouvelle',this)">🔴 Nouvelles</div>
  <div class="tab" onclick="setTab('acceptee',this)">🍳 Cuisine</div>
  <div class="tab" onclick="setTab('prete',this)">🟡 Prêtes</div>
  <div class="tab" onclick="setTab('livree',this)">✅ Livrées</div>
</div>

<!-- ORDERS -->
<div class="orders-grid" id="ordersGrid">
  <div class="empty"><div class="empty-ico">📡</div><div>Connexion Firebase...</div></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const CFG_KEY = 'troprapide_resto_cfg';
let db = null, myResto = '', allOrders = {}, currentTab = 'active', isOpen = true;
let _knownIds = new Set(), _firstLoad = true;

/* ── CONNECT ── */
window.connect = function(){
  const resto = document.getElementById('cfg_resto').value;
  const dburl = document.getElementById('cfg_db').value.trim();
  const apiKey = document.getElementById('cfg_key').value.trim();
  const pid    = document.getElementById('cfg_pid').value.trim();
  if(!dburl||!apiKey||!pid){ toast('Remplissez tous les champs','e'); return; }
  try{
    const app = initializeApp({apiKey, databaseURL:dburl, projectId:pid}, 'resto-'+Date.now());
    db = getDatabase(app);
    myResto = resto;
    const cfg = {dburl, apiKey, pid, resto};
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    document.getElementById('cfgOverlay').style.display = 'none';
    init();
  }catch(e){ toast('Erreur: '+e.message,'e'); }
};

const saved = localStorage.getItem(CFG_KEY);
if(saved){ try{
  const c = JSON.parse(saved);
  const app = initializeApp({apiKey:c.apiKey, databaseURL:c.dburl, projectId:c.pid}, 'resto-'+Date.now());
  db = getDatabase(app);
  myResto = c.resto || 'Mémé Choco';
  document.getElementById('cfgOverlay').style.display = 'none';
  init();
}catch(e){} }

function init(){
  document.getElementById('restoName').textContent = myResto;
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  // ── Écouter les commandes Firebase en temps réel ──
  onValue(ref(db, 'orders'), snap => {
    allOrders = snap.val() || {};
    render();
    if(!_firstLoad) checkNew();
    _firstLoad = false;
    Object.keys(allOrders).forEach(id => _knownIds.add(id));
  });
}

/* ── CHECK NOUVELLES COMMANDES ── */
function checkNew(){
  const newOnes = Object.entries(allOrders).filter(([id,o]) =>
    !_knownIds.has(id) && o.restaurant === myResto && o.status === 'nouvelle'
  );
  if(newOnes.length > 0){
    playBeep();
    newOnes.forEach(([id,o]) => {
      toast(`🔔 Nouvelle commande #${id.slice(-4).toUpperCase()} — ${o.client}`,'w');
      // Notification navigateur
      if(Notification.permission === 'granted'){
        new Notification('🍽️ '+myResto+' — Nouvelle commande !', {
          body: `#${id.slice(-4).toUpperCase()} · ${o.client} · ${o.zone} · ${Number(o.amount).toLocaleString()} FCFA`,
          icon: '/favicon.ico'
        });
      }
    });
    newOnes.forEach(([id]) => _knownIds.add(id));
  } else {
    Object.keys(allOrders).forEach(id => _knownIds.add(id));
  }
}

/* ── TABS ── */
window.setTab = function(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
};

/* ── RENDER ── */
function render(){
  // Filtrer par restaurant
  const mine = Object.entries(allOrders).filter(([,o]) => o.restaurant === myResto);

  // Stats
  document.getElementById('s-new').textContent    = mine.filter(([,o])=>o.status==='nouvelle').length;
  document.getElementById('s-kitchen').textContent = mine.filter(([,o])=>o.status==='acceptee').length;
  document.getElementById('s-ready').textContent   = mine.filter(([,o])=>o.status==='prete').length;
  document.getElementById('s-done').textContent    = mine.filter(([,o])=>o.status==='livree').length;

  // Filtrer selon tab
  let filtered;
  if(currentTab === 'active')
    filtered = mine.filter(([,o])=>['nouvelle','acceptee','prete'].includes(o.status));
  else
    filtered = mine.filter(([,o])=>o.status === currentTab);

  filtered.sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));

  const grid = document.getElementById('ordersGrid');
  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="empty-ico">${currentTab==='active'?'🎉':'🔍'}</div><div>${currentTab==='active'?'Aucune commande en cours — tout est calme !':'Aucune commande dans cet onglet'}</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map(([id,o])=>{
    const elapsed = Math.floor((Date.now()-(o.createdAt||Date.now()))/60000);
    const isUrgent = elapsed > 15 && ['nouvelle','acceptee'].includes(o.status);
    const badgeMap = {
      nouvelle:`<span class="status-badge s-nouvelle">🔴 Nouvelle</span>`,
      acceptee:`<span class="status-badge s-acceptee">🍳 En cuisine</span>`,
      prete:`<span class="status-badge s-prete">🟡 Prête</span>`,
      'en-route':`<span class="status-badge s-en-route">🔵 En livraison</span>`,
    };
    const badge = badgeMap[o.status] || `<span class="status-badge">${o.status}</span>`;
    let actions = '';
    if(o.status==='nouvelle')
      actions=`<button class="act-btn btn-accept" onclick="acceptOrder('${id}')">✅ Accepter</button><button class="act-btn btn-cancel" onclick="cancelOrder('${id}')">✗</button>`;
    else if(o.status==='acceptee')
      actions=`<button class="act-btn btn-ready" onclick="readyOrder('${id}')">🟡 Commande prête !</button>`;

    return `
    <div class="order-card ${o.status}" id="card-${id}">
      <div class="order-head">
        <div>
          <div class="order-id">#${id.slice(-6).toUpperCase()}</div>
          <div class="order-time">il y a ${elapsed} min · ${o.paiement||''}</div>
        </div>
        ${badge}
      </div>
      ${isUrgent?`<div class="urgent-badge">🔴 EN RETARD — ${elapsed} min !</div>`:''}
      <div class="order-items">${o.items||'—'}</div>
      <div class="order-meta">
        <span class="meta-chip">👤 ${o.client||'—'}</span>
        <span class="meta-chip">📍 ${o.zone||'—'}</span>
        <span class="meta-chip" style="color:var(--yellow)">💰 ${o.amount?Number(o.amount).toLocaleString():'—'} FCFA</span>
        ${o.notes?`<span class="meta-chip">📝 ${o.notes}</span>`:''}
        ${o.priority==='urgente'?`<span class="meta-chip" style="color:var(--red)">🔴 URGENT</span>`:''}
        ${o.livreur?`<span class="meta-chip" style="color:var(--blue)">🏍️ ${o.livreur}</span>`:''}
      </div>
      ${actions?`<div class="order-actions">${actions}</div>`:''}
    </div>`;
  }).join('');
}

/* ── ACTIONS ── */
window.acceptOrder = async function(id){
  await update(ref(db,'orders/'+id),{status:'acceptee', acceptedAt:Date.now()});
  flash(id); toast(`✅ Commande #${id.slice(-4).toUpperCase()} acceptée — en cuisine !`,'s');
};
window.readyOrder = async function(id){
  await update(ref(db,'orders/'+id),{status:'prete', readyAt:Date.now()});
  flash(id); toast(`🟡 Commande #${id.slice(-4).toUpperCase()} prête — livreur notifié !`,'s');
};
window.cancelOrder = async function(id){
  if(!confirm('Annuler cette commande ?')) return;
  await update(ref(db,'orders/'+id),{status:'annulee'});
  toast(`❌ Commande annulée`,'e');
};

function flash(id){
  const c = document.getElementById('card-'+id);
  if(c){ c.classList.add('new-flash'); setTimeout(()=>c.classList.remove('new-flash'),600); }
}

window.toggleOpen = function(){
  isOpen = !isOpen;
  const btn = document.getElementById('openBtn');
  btn.textContent = isOpen ? '🟢 OUVERT' : '🔴 FERMÉ';
  btn.className = 'open-btn ' + (isOpen?'open':'closed');
};

window.logout = function(){
  if(!confirm('Déconnecter ce restaurant ?')) return;
  localStorage.removeItem(CFG_KEY);
  location.reload();
};

/* ── BIP ── */
function playBeep(){
  try{
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[1100,.2],[880,.4]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.15);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.16);
    });
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}

/* ── NOTIFICATIONS ── */
if('Notification' in window && Notification.permission==='default') Notification.requestPermission();

/* ── CLOCK ── */
setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr'); },1000);

/* ── TOAST ── */
function toast(msg,type='s'){
  const w=document.getElementById('toastWrap'),el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${{s:'✅',e:'❌',w:'🔔'}[type]}</span><span style="font-size:.83rem;font-weight:600">${msg}</span>`;
  w.prepend(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';},4000);
  setTimeout(()=>el.remove(),4400);
}
</script>
</body>
</html>
