<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatcher — TropRapide</title>
<style>
:root{
  --bg:#0A0A0A;--card:#161616;--border:#242424;
  --yellow:#F5C800;--green:#22C55E;--red:#EF4444;--orange:#F97316;--blue:#3B82F6;
  --text:#F5F5F0;--muted:#666;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;min-height:100vh;}

/* CONFIG OVERLAY */
.cfg-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.cfg-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:420px;}
.cfg-logo{font-size:1.4rem;font-weight:900;color:var(--yellow);text-align:center;margin-bottom:4px;letter-spacing:-0.5px;}
.cfg-sub{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:22px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fg input{background:#1a1a1a;border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:.9rem;outline:none;transition:border-color .2s;width:100%;}
.fg input:focus{border-color:var(--yellow);}
.btn-cfg{width:100%;padding:13px;background:var(--yellow);color:#000;border:none;border-radius:10px;font-size:.9rem;font-weight:800;cursor:pointer;margin-top:4px;}

/* TOP BAR */
.topbar{padding:14px 20px;background:#0a0a0a;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.brand{font-size:1.1rem;font-weight:900;color:var(--yellow);}
.topbar-right{display:flex;gap:10px;align-items:center;}
.clock{color:var(--muted);font-size:.88rem;}
.btn-reset{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.8rem;}
.notif-btn{background:#1a1200;border:1px solid var(--yellow);color:var(--yellow);padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px;background:#060606;border-bottom:1px solid var(--border);}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);text-align:center;}
.stat-val{font-size:1.7rem;font-weight:900;margin-bottom:4px;}
.stat-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

/* FILTER TABS */
.tabs{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border);background:#080808;overflow-x:auto;}
.tab{padding:7px 16px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);white-space:nowrap;transition:all .2s;}
.tab.active{background:var(--yellow);color:#000;border-color:var(--yellow);}

/* ORDERS */
.orders-wrap{padding:16px 20px;max-width:900px;margin:0 auto;}
.order-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;transition:border-color .2s;}
.order-card.nouvelle{border-left:4px solid var(--orange);}
.order-card.acceptee{border-left:4px solid var(--green);}
.order-card.prete{border-left:4px solid var(--yellow);}
.order-card.en-route{border-left:4px solid var(--blue);}
.order-card.livree{border-left:4px solid #444;opacity:.7;}
.order-card.new-flash{animation:flash .6s ease;}
@keyframes flash{0%,100%{background:var(--card)}50%{background:#1a1200;}}

.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.order-id{font-weight:900;font-size:1rem;color:var(--yellow);font-family:monospace;}
.order-type-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap;}
.t-colis{background:#1a0a00;color:var(--orange);}
.t-courses{background:#001a0a;color:var(--green);}
.t-medicaments{background:#00001a;color:var(--blue);}
.t-documents{background:#0a0a1a;color:#a78bfa;}
.t-entreprise{background:#1a1a00;color:var(--yellow);}
.t-repas{background:#0a1a00;color:var(--green);}

.order-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
@media(max-width:500px){.order-body{grid-template-columns:1fr;}}
.info-block{}
.info-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;font-weight:600;}
.info-val{font-weight:600;font-size:.88rem;}

.order-actions{display:flex;gap:8px;flex-wrap:wrap;}
.act-btn{padding:8px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem;transition:opacity .2s;}
.act-btn:active{opacity:.7;}
.btn-accept{background:var(--green);color:#fff;}
.btn-ready{background:var(--yellow);color:#000;}
.btn-deliver{background:var(--blue);color:#fff;}
.btn-cancel{background:#1a0000;border:1px solid var(--border);color:var(--red);}
.btn-wa{background:#075e54;color:#fff;}

.status-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700;}
.s-nouvelle{background:#1a0a00;color:var(--orange);}
.s-acceptee{background:#0a1a00;color:var(--green);}
.s-prete{background:#1a1500;color:var(--yellow);}
.s-en-route{background:#00001a;color:var(--blue);}
.s-livree{background:#0a150a;color:var(--green);}
.s-annulee{background:#1a0000;color:var(--red);}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-ico{font-size:3rem;margin-bottom:12px;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;width:calc(100%-32px);max-width:400px;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:10px;animation:tup .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.toast.s{border-left:3px solid var(--green)}.toast.e{border-left:3px solid var(--red)}.toast.w{border-left:3px solid var(--yellow)}
@keyframes tup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);}
</style>
</head>
<body>

<!-- CONFIG FIREBASE -->
<div class="cfg-overlay" id="cfgOverlay">
  <div class="cfg-card">
    <div class="cfg-logo">🛵 TROPRAPIDE</div>
    <div class="cfg-sub">Dispatcher — Configuration Firebase (une seule fois)</div>
    <div class="fg"><label>Database URL</label>
      <input type="text" id="cfg_db" placeholder="https://troprapide-xxx.firebaseio.com"></div>
    <div class="fg"><label>API Key</label>
      <input type="text" id="cfg_key" placeholder="AIzaSy..."></div>
    <div class="fg"><label>Project ID</label>
      <input type="text" id="cfg_pid" placeholder="troprapide-xxxxx"></div>
    <button class="btn-cfg" onclick="connectFirebase()">🔥 CONNECTER</button>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">🛵 DISPATCHER — TropRapide</div>
  <div class="topbar-right">
    <span class="clock" id="clock"></span>
    <button class="notif-btn" id="notifBtn" onclick="enableNotifs()">🔔 Activer notifications</button>
    <button class="btn-reset" onclick="resetCfg()">⚙️ Config</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total" style="color:var(--yellow)">0</div><div class="stat-lbl">Total aujourd'hui</div></div>
  <div class="stat"><div class="stat-val" id="s-new" style="color:var(--orange)">0</div><div class="stat-lbl">Nouvelles</div></div>
  <div class="stat"><div class="stat-val" id="s-enroute" style="color:var(--blue)">0</div><div class="stat-lbl">En route</div></div>
  <div class="stat"><div class="stat-val" id="s-done" style="color:var(--green)">0</div><div class="stat-lbl">Livrées</div></div>
</div>

<!-- TABS FILTRES -->
<div class="tabs">
  <div class="tab active" onclick="setFilter('all',this)">📋 Tout voir</div>
  <div class="tab" onclick="setFilter('nouvelle',this)">🔴 Nouvelles</div>
  <div class="tab" onclick="setFilter('colis',this)">📦 Colis</div>
  <div class="tab" onclick="setFilter('courses',this)">🛒 Courses</div>
  <div class="tab" onclick="setFilter('medicaments',this)">💊 Médicaments</div>
  <div class="tab" onclick="setFilter('documents',this)">📄 Documents</div>
  <div class="tab" onclick="setFilter('entreprise',this)">🏢 Pro</div>
  <div class="tab" onclick="setFilter('repas',this)">🍽 Repas</div>
</div>

<!-- ORDERS LIST -->
<div class="orders-wrap" id="ordersList">
  <div class="empty"><div class="empty-ico">📡</div><div>Connexion Firebase en attente...</div></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const CFG_KEY = 'troprapide_firebase_cfg'; // même clé que commande.html
let db = null;
let allOrders = {};
let currentFilter = 'all';
let _knownIds = new Set();
let _firstLoad = true;

/* ── FIREBASE ── */
window.connectFirebase = function(){
  const dburl  = document.getElementById('cfg_db').value.trim();
  const apiKey = document.getElementById('cfg_key').value.trim();
  const pid    = document.getElementById('cfg_pid').value.trim();
  if(!dburl||!apiKey||!pid){ toast('Remplissez tous les champs','e'); return; }
  try{
    const app = initializeApp({apiKey, databaseURL:dburl, projectId:pid});
    db = getDatabase(app);
    localStorage.setItem(CFG_KEY, JSON.stringify({dburl, apiKey, pid}));
    document.getElementById('cfgOverlay').style.display = 'none';
    toast('🔥 Firebase connecté !','s');
    startListener();
  }catch(e){ toast('Erreur: '+e.message,'e'); }
};

// Auto-connect avec les mêmes credentials que commande.html
const saved = localStorage.getItem(CFG_KEY);
if(saved){
  try{
    const c = JSON.parse(saved);
    const app = initializeApp({apiKey:c.apiKey, databaseURL:c.dburl, projectId:c.pid});
    db = getDatabase(app);
    document.getElementById('cfgOverlay').style.display = 'none';
    startListener();
  }catch(e){}
}

window.resetCfg = function(){
  localStorage.removeItem(CFG_KEY);
  location.reload();
};

/* ── LISTENER FIREBASE ── */
function startListener(){
  onValue(ref(db, 'orders'), snap => {
    allOrders = snap.val() || {};
    render();
    if(!_firstLoad) checkNewOrders();
    _firstLoad = false;
    Object.keys(allOrders).forEach(id => _knownIds.add(id));
  });
}

function checkNewOrders(){
  const newOnes = Object.keys(allOrders).filter(id => !_knownIds.has(id));
  if(newOnes.length > 0){
    playBeep();
    newOnes.forEach(id => {
      const o = allOrders[id];
      toast(`🔔 Nouvelle commande #${id.slice(-4).toUpperCase()} — ${o.type||'repas'} — ${o.client}`,'w');
    });
    newOnes.forEach(id => _knownIds.add(id));
  }
}

/* ── FILTRE ── */
window.setFilter = function(f, el){
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
};

/* ── RENDER ── */
const TYPE_ICONS = {repas:'🍽',colis:'📦',courses:'🛒',medicaments:'💊',documents:'📄',entreprise:'🏢'};
const TYPE_LABELS = {repas:'Repas',colis:'Colis',courses:'Courses',medicaments:'Médicaments',documents:'Documents',entreprise:'Pro'};

function render(){
  // Stats
  const all = Object.values(allOrders);
  document.getElementById('s-total').textContent   = all.length;
  document.getElementById('s-new').textContent     = all.filter(o=>o.status==='nouvelle').length;
  document.getElementById('s-enroute').textContent = all.filter(o=>o.status==='en-route').length;
  document.getElementById('s-done').textContent    = all.filter(o=>o.status==='livree').length;

  // Filter
  let filtered = Object.entries(allOrders).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  if(currentFilter === 'nouvelle') filtered = filtered.filter(([,o])=>o.status==='nouvelle');
  else if(currentFilter !== 'all') filtered = filtered.filter(([,o])=>o.type===currentFilter);

  const container = document.getElementById('ordersList');
  if(filtered.length === 0){
    container.innerHTML = `<div class="empty"><div class="empty-ico">${currentFilter==='all'?'📭':'🔍'}</div><div>${currentFilter==='all'?'Aucune commande reçue':'Aucune commande dans cette catégorie'}</div></div>`;
    return;
  }

  container.innerHTML = filtered.map(([id,o])=>{
    const elapsed = Math.floor((Date.now()-(o.createdAt||Date.now()))/60000);
    const typeIco = TYPE_ICONS[o.type]||'📦';
    const typeLbl = TYPE_LABELS[o.type]||o.type||'livraison';
    const typeCls = `t-${o.type||'colis'}`;
    const statusBadge = {
      'nouvelle': `<span class="status-badge s-nouvelle">🔴 Nouvelle</span>`,
      'acceptee': `<span class="status-badge s-acceptee">🟠 Acceptée</span>`,
      'prete':    `<span class="status-badge s-prete">🟡 Prête</span>`,
      'en-route': `<span class="status-badge s-en-route">🔵 En route</span>`,
      'livree':   `<span class="status-badge s-livree">✅ Livrée</span>`,
      'annulee':  `<span class="status-badge s-annulee">❌ Annulée</span>`,
    }[o.status] || `<span class="status-badge">${o.status}</span>`;

    // Boutons selon statut
    let actions = '';
    if(o.status === 'nouvelle'){
      actions = `
        <button class="act-btn btn-accept" onclick="updateStatus('${id}','acceptee')">✅ Accepter</button>
        <button class="act-btn btn-wa" onclick="callWA('${id}')">💬 WhatsApp client</button>
        <button class="act-btn btn-cancel" onclick="updateStatus('${id}','annulee')">✗ Annuler</button>`;
    } else if(o.status === 'acceptee'){
      actions = `
        <button class="act-btn btn-ready" onclick="updateStatus('${id}','prete')">🟡 Marquer Prête</button>
        <button class="act-btn btn-wa" onclick="callWA('${id}')">💬 WhatsApp client</button>`;
    } else if(o.status === 'prete'){
      actions = `
        <button class="act-btn btn-deliver" onclick="updateStatus('${id}','en-route')">🏍️ En livraison</button>
        <button class="act-btn btn-wa" onclick="callWA('${id}')">💬 WhatsApp client</button>`;
    } else if(o.status === 'en-route'){
      actions = `
        <button class="act-btn btn-accept" onclick="updateStatus('${id}','livree')">✅ Livrée !</button>
        <button class="act-btn btn-wa" onclick="callWA('${id}')">💬 WhatsApp client</button>`;
    }

    return `
    <div class="order-card ${o.status}" id="card-${id}">
      <div class="order-head">
        <div>
          <div class="order-id">#${id.slice(-6).toUpperCase()}</div>
          <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <span class="order-type-badge ${typeCls}">${typeIco} ${typeLbl}</span>
            ${statusBadge}
            <span style="font-size:.72rem;color:var(--muted);">${elapsed}min</span>
          </div>
        </div>
      </div>
      <div class="order-body">
        <div class="info-block">
          <div class="info-lbl">👤 Client</div>
          <div class="info-val">${o.client||'—'}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:2px;">${o.phone||''}</div>
        </div>
        <div class="info-block">
          <div class="info-lbl">📍 Livraison</div>
          <div class="info-val">${o.zone||'—'}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:2px;">${o.adresse||''}</div>
        </div>
        <div class="info-block">
          <div class="info-lbl">📦 Commande</div>
          <div class="info-val" style="font-size:.82rem;">${o.items||'—'}</div>
        </div>
        <div class="info-block">
          <div class="info-lbl">💰 Montant & Paiement</div>
          <div class="info-val" style="color:var(--yellow);">${o.amount ? Number(o.amount).toLocaleString('fr')+' FCFA' : '—'}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:2px;">${o.paiement||''}</div>
        </div>
        ${o.retrait ? `<div class="info-block"><div class="info-lbl">🔄 Retrait (départ)</div><div class="info-val">${o.retrait}</div></div>` : ''}
        ${o.notes ? `<div class="info-block"><div class="info-lbl">📝 Notes</div><div class="info-val">${o.notes}</div></div>` : ''}
        ${o.priority === 'urgente' ? `<div class="info-block" style="grid-column:1/-1;"><span style="background:#1a0000;color:var(--red);padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;">🔴 URGENTE</span></div>` : ''}
      </div>
      ${actions ? `<div class="order-actions">${actions}</div>` : ''}
    </div>`;
  }).join('');
}

/* ── ACTIONS ── */
window.updateStatus = async function(id, newStatus){
  if(!db) return;
  try{
    await update(ref(db, 'orders/'+id), {status: newStatus, updatedAt: Date.now()});
    toast(`✅ Commande #${id.slice(-4).toUpperCase()} → ${newStatus}`,'s');
    // Flash card
    const card = document.getElementById('card-'+id);
    if(card){ card.classList.add('new-flash'); setTimeout(()=>card.classList.remove('new-flash'),700); }
  }catch(e){ toast('Erreur: '+e.message,'e'); }
};

window.callWA = function(id){
  const o = allOrders[id];
  if(!o||!o.phone) return;
  const phone = o.phone.replace(/\D/g,'');
  const msg = encodeURIComponent(
    `Bonjour ${o.client} 👋\n` +
    `Votre commande TropRapide #${id.slice(-6).toUpperCase()} a été reçue !\n` +
    `Nous traitons votre demande et vous rappelons dans 2 minutes.\n` +
    `Merci de votre confiance 🛵`
  );
  window.open(`https://wa.me/${phone.startsWith('225')?phone:'225'+phone}?text=${msg}`, '_blank');
};

/* ── BIP SONORE ── */
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.2);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}

/* ── NOTIFICATIONS NAVIGATEUR ── */
window.enableNotifs = async function(){
  if(!('Notification' in window)){ toast('Notifications non supportées','e'); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    document.getElementById('notifBtn').style.background='#022';
    document.getElementById('notifBtn').style.color='var(--green)';
    document.getElementById('notifBtn').textContent='✅ Notifications actives';
    toast('Notifications activées !','s');
  } else { toast('Permission refusée','e'); }
};

/* ── CLOCK ── */
setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr'); }, 1000);

/* ── TOAST ── */
function toast(msg, type='s'){
  const w=document.getElementById('toastWrap'), el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${{s:'✅',e:'❌',w:'⚠️'}[type]}</span><span style="font-size:.83rem;font-weight:600;">${msg}</span>`;
  w.prepend(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';},4000);
  setTimeout(()=>el.remove(),4400);
}
</script>
</body>
</html>
