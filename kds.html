<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDS Cuisine — TropRapide</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#161616;--border:#242424;--yellow:#F5C800;--green:#22C55E;--red:#EF4444;--orange:#F97316;--blue:#3B82F6;--text:#F5F5F0;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* CONFIG */
.cfg{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.cfg-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:420px;}
.cfg-logo{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:900;color:var(--yellow);text-align:center;margin-bottom:4px;}
.cfg-sub{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:22px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fg input{background:#1a1a1a;border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:.9rem;outline:none;transition:border-color .2s;width:100%;}
.fg input:focus{border-color:var(--yellow);}
.btn-cfg{width:100%;padding:13px;background:var(--yellow);color:#000;border:none;border-radius:10px;font-size:.95rem;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;margin-top:4px;}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#0a0a0a;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.kds-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:900;color:var(--yellow);}
.header-stats{display:flex;gap:20px;align-items:center;}
.hstat{text-align:center;}
.hstat-val{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:900;}
.hstat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;}
.clock{color:var(--muted);font-size:.88rem;}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.78rem;}

/* 3 COLONNES KDS */
.kds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;height:calc(100vh - 70px);}
@media(max-width:900px){.kds-grid{grid-template-columns:1fr;height:auto;}}

.kds-col{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.kds-col:last-child{border-right:none;}
.col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#080808;flex-shrink:0;}
.col-title{font-family:'Syne',sans-serif;font-weight:800;font-size:.88rem;}
.col-count{background:var(--border);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;}

.col-nouvelle .col-title{color:var(--orange);}
.col-nouvelle .col-count{background:rgba(249,115,22,.15);color:var(--orange);}
.col-acceptee .col-title{color:var(--blue);}
.col-acceptee .col-count{background:rgba(59,130,246,.15);color:var(--blue);}
.col-prete .col-title{color:var(--yellow);}
.col-prete .col-count{background:rgba(245,200,0,.15);color:var(--yellow);}

.col-body{flex:1;overflow-y:auto;padding:10px;}

/* TICKET */
.ticket{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.ticket.urgent{border-color:var(--red);animation:pulse-border 1s infinite;}
@keyframes pulse-border{0%,100%{border-color:var(--red)}50%{border-color:#5a0000;}}
.ticket.new-a{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}

.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ticket-id{font-family:'Syne',sans-serif;font-weight:900;font-size:1rem;color:var(--yellow);}
.ticket-timer{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:20px;}
.timer-ok{background:#001a0a;color:var(--green);}
.timer-warn{background:#1a1000;color:var(--orange);}
.timer-late{background:#1a0000;color:var(--red);}

.ticket-client{font-size:.82rem;color:var(--muted);margin-bottom:8px;}
.ticket-items{font-size:.92rem;font-weight:600;line-height:1.6;padding:10px;background:#0a0a0a;border-radius:8px;margin-bottom:10px;}
.ticket-zone{font-size:.78rem;color:var(--muted);margin-bottom:10px;}
.ticket-notes{font-size:.78rem;color:var(--orange);background:#1a0a00;padding:6px 10px;border-radius:6px;margin-bottom:10px;}

.ticket-btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:.88rem;font-family:'Syne',sans-serif;transition:all .15s;min-height:48px;}
.ticket-btn:active{transform:scale(.97);}
.btn-accept-kds{background:var(--orange);color:#fff;}
.btn-ready-kds{background:var(--yellow);color:#000;}

.empty-col{text-align:center;padding:40px 16px;color:var(--muted);}
.empty-col .ico{font-size:2rem;margin-bottom:8px;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;width:calc(100%-32px);max-width:400px;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:10px;animation:tup .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.toast.s{border-left:3px solid var(--green)}.toast.e{border-left:3px solid var(--red)}.toast.w{border-left:3px solid var(--yellow)}
@keyframes tup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--border);}

/* ══ RESPONSIVE ══ */
@media(max-width:900px){
  .header{padding:11px 14px;flex-wrap:wrap;gap:8px;}
  .kds-title{font-size:1rem;}
  .header-stats{gap:14px;}
  .hstat-val{font-size:1.2rem;}
  .kds-grid{grid-template-columns:1fr;height:auto;}
  .kds-col{border-right:none;border-bottom:1px solid var(--border);}
  .kds-col:last-child{border-bottom:none;}
  .col-body{max-height:60vh;overflow-y:auto;}
  .ticket-items{font-size:.95rem;}
}
@media(max-width:480px){
  .header{padding:10px 12px;}
  .hstat-val{font-size:1rem;}
  .hstat-lbl{font-size:.6rem;}
  .col-header{padding:10px 12px;}
  .col-title{font-size:.8rem;}
  .ticket{padding:12px;}
  .ticket-id{font-size:.92rem;}
  .col-body{padding:8px;}
}
</style>
</head>
<body>

<!-- CONFIG -->
<div class="cfg" id="cfgOverlay">
  <div class="cfg-card">
    <div class="cfg-logo">🍳 KDS CUISINE</div>
    <div class="cfg-sub">Écran de cuisine — TropRapide</div>
    <div class="fg"><label>Firebase Database URL</label>
      <input type="text" id="cfg_db" placeholder="https://troprapide-xxx.firebaseio.com"></div>
    <div class="fg"><label>API Key</label>
      <input type="text" id="cfg_key" placeholder="AIzaSy..."></div>
    <div class="fg"><label>Project ID</label>
      <input type="text" id="cfg_pid" placeholder="troprapide-xxxxx"></div>
    <button class="btn-cfg" onclick="connect()">🔥 CONNECTER</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="kds-title">🍳 CUISINE — KDS</div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-val" id="h-new" style="color:var(--orange)">0</div><div class="hstat-lbl">En attente</div></div>
    <div class="hstat"><div class="hstat-val" id="h-kitch" style="color:var(--blue)">0</div><div class="hstat-lbl">En cuisine</div></div>
    <div class="hstat"><div class="hstat-val" id="h-ready" style="color:var(--yellow)">0</div><div class="hstat-lbl">Prêtes</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="clock" id="clock"></span>
    <button class="logout-btn" onclick="logout()">⚙️</button>
  </div>
</div>

<!-- KDS GRID -->
<div class="kds-grid">
  <!-- COL 1: NOUVELLES -->
  <div class="kds-col col-nouvelle">
    <div class="col-header">
      <span class="col-title">🔴 NOUVELLES COMMANDES</span>
      <span class="col-count" id="cnt-new">0</span>
    </div>
    <div class="col-body" id="col-nouvelle"></div>
  </div>
  <!-- COL 2: EN CUISINE -->
  <div class="kds-col col-acceptee">
    <div class="col-header">
      <span class="col-title">🍳 EN PRÉPARATION</span>
      <span class="col-count" id="cnt-acceptee">0</span>
    </div>
    <div class="col-body" id="col-acceptee"></div>
  </div>
  <!-- COL 3: PRÊTES -->
  <div class="kds-col col-prete">
    <div class="col-header">
      <span class="col-title">🟡 PRÊTES À LIVRER</span>
      <span class="col-count" id="cnt-prete">0</span>
    </div>
    <div class="col-body" id="col-prete"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const CFG_KEY = 'troprapide_firebase_cfg'; // même clé que commande.html
let db = null, allOrders = {};
let _knownIds = new Set(), _firstLoad = true;

/* ── CONNECT ── */
window.connect = function(){
  const dburl = document.getElementById('cfg_db').value.trim();
  const apiKey = document.getElementById('cfg_key').value.trim();
  const pid    = document.getElementById('cfg_pid').value.trim();
  if(!dburl||!apiKey||!pid){ toast('Remplissez tous les champs','e'); return; }
  try{
    const app = initializeApp({apiKey, databaseURL:dburl, projectId:pid}, 'kds-'+Date.now());
    db = getDatabase(app);
    localStorage.setItem(CFG_KEY, JSON.stringify({dburl, apiKey, pid}));
    document.getElementById('cfgOverlay').style.display = 'none';
    startListener();
  }catch(e){ toast('Erreur: '+e.message,'e'); }
};

const saved = localStorage.getItem(CFG_KEY);
if(saved){ try{
  const c = JSON.parse(saved);
  const app = initializeApp({apiKey:c.apiKey, databaseURL:c.dburl, projectId:c.pid}, 'kds-'+Date.now());
  db = getDatabase(app);
  document.getElementById('cfgOverlay').style.display = 'none';
  startListener();
}catch(e){} }

function startListener(){
  onValue(ref(db,'orders'), snap => {
    allOrders = snap.val() || {};
    render();
    if(!_firstLoad) checkNew();
    _firstLoad = false;
    Object.keys(allOrders).forEach(id => _knownIds.add(id));
  });
}

function checkNew(){
  const newOnes = Object.keys(allOrders).filter(id =>
    !_knownIds.has(id) && ['nouvelle','acceptee'].includes(allOrders[id].status) && allOrders[id].type === 'repas'
  );
  if(newOnes.length > 0){
    playBeep();
    newOnes.forEach(id => toast(`🔔 Nouvelle commande cuisine #${id.slice(-4).toUpperCase()}`,'w'));
    newOnes.forEach(id => _knownIds.add(id));
  } else {
    Object.keys(allOrders).forEach(id => _knownIds.add(id));
  }
}

/* ── RENDER ── */
function render(){
  // Seulement les commandes repas (type = repas ou pas de type)
  const repasOrders = Object.entries(allOrders)
    .filter(([,o]) => !o.type || o.type === 'repas')
    .sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));

  const nouvelles = repasOrders.filter(([,o])=>o.status==='nouvelle');
  const acceptees = repasOrders.filter(([,o])=>o.status==='acceptee');
  const pretes    = repasOrders.filter(([,o])=>o.status==='prete');

  // Stats header
  document.getElementById('h-new').textContent   = nouvelles.length;
  document.getElementById('h-kitch').textContent = acceptees.length;
  document.getElementById('h-ready').textContent = pretes.length;
  document.getElementById('cnt-new').textContent     = nouvelles.length;
  document.getElementById('cnt-acceptee').textContent = acceptees.length;
  document.getElementById('cnt-prete').textContent    = pretes.length;

  // Render colonnes
  renderCol('col-nouvelle', nouvelles, 'nouvelle');
  renderCol('col-acceptee', acceptees, 'acceptee');
  renderCol('col-prete',    pretes,    'prete');
}

function renderCol(colId, orders, status){
  const col = document.getElementById(colId);
  if(orders.length === 0){
    const msgs = {
      nouvelle:'<div class="empty-col"><div class="ico">✅</div>Aucune nouvelle commande</div>',
      acceptee:'<div class="empty-col"><div class="ico">🍳</div>Rien en préparation</div>',
      prete:'<div class="empty-col"><div class="ico">🟡</div>Aucune commande prête</div>',
    };
    col.innerHTML = msgs[status]||'';
    return;
  }
  col.innerHTML = orders.map(([id,o])=>{
    const elapsed = Math.floor((Date.now()-(o.createdAt||Date.now()))/60000);
    const isUrgent = elapsed > 15;
    const timerClass = elapsed < 8 ? 'timer-ok' : elapsed < 15 ? 'timer-warn' : 'timer-late';
    let btn = '';
    if(status==='nouvelle')
      btn = `<button class="ticket-btn btn-accept-kds" onclick="acceptOrder('${id}')">🍳 Prendre en cuisine</button>`;
    else if(status==='acceptee')
      btn = `<button class="ticket-btn btn-ready-kds" onclick="readyOrder('${id}')">🟡 PRÊTE !</button>`;

    return `
    <div class="ticket ${isUrgent&&status!=='prete'?'urgent':''}" id="tkt-${id}">
      <div class="ticket-head">
        <div class="ticket-id">#${id.slice(-6).toUpperCase()}</div>
        <span class="ticket-timer ${timerClass}">${elapsed}min</span>
      </div>
      <div class="ticket-client">👤 ${o.client||'—'} · 📍 ${o.zone||'—'} · 📞 ${o.phone||'—'}</div>
      <div class="ticket-items">${o.items||'—'}</div>
      ${o.notes?`<div class="ticket-notes">📝 ${o.notes}</div>`:''}
      <div class="ticket-zone">💰 ${o.amount?Number(o.amount).toLocaleString():'—'} FCFA · ${o.paiement||''}</div>
      ${btn}
    </div>`;
  }).join('');
}

/* ── ACTIONS ── */
window.acceptOrder = async function(id){
  await update(ref(db,'orders/'+id),{status:'acceptee', acceptedAt:Date.now()});
  toast(`🍳 #${id.slice(-4).toUpperCase()} en préparation`,'s');
};
window.readyOrder = async function(id){
  await update(ref(db,'orders/'+id),{status:'prete', readyAt:Date.now()});
  playBeepReady();
  toast(`🟡 #${id.slice(-4).toUpperCase()} PRÊTE — livreur alerté !`,'s');
};

window.logout = function(){
  if(!confirm('Réinitialiser la configuration Firebase ?')) return;
  // ✅ Ne supprimer que si l'utilisateur confirme explicitement
  localStorage.removeItem(CFG_KEY);
  location.reload();
};

/* ── BIP ── */
function playBeep(){
  try{
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    [[660,0],[880,.2],[1100,.4]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.5,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.19);
    });
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
  }catch(e){}
}
function playBeepReady(){
  try{
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    [[1100,0],[880,.2],[660,.4]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.15);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.16);
    });
  }catch(e){}
}

/* ── UPDATE TIMERS toutes les 30s ── */
setInterval(render, 30000);

/* ── CLOCK ── */
setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr'); },1000);

/* ── TOAST ── */
function toast(msg,type='s'){
  const w=document.getElementById('toastWrap'),el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${{s:'✅',e:'❌',w:'🔔'}[type]}</span><span style="font-size:.83rem;font-weight:600">${msg}</span>`;
  w.prepend(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';},4000);
  setTimeout(()=>el.remove(),4400);
}
</script>
</body>
</html>
