<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — TropRapide</title>
<style>
:root{
  --bg:#000;--card:#0d0d0d;--card2:#111;--border:#1e1e1e;
  --yellow:#F5C800;--green:#22C55E;--red:#EF4444;--orange:#F97316;--blue:#3B82F6;
  --text:#fff;--muted:#888;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;}

/* TOP BAR */
.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;background:#0a0a0a;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.topbar h1{font-size:1.1rem;font-weight:900;color:var(--yellow);}
.topbar-right{display:flex;gap:10px;align-items:center;}
.clock{color:var(--muted);font-size:.9rem;}

/* BUTTONS */
.btn{padding:8px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem;transition:opacity .2s;}
.btn:active{opacity:.7;}
.btn-yellow{background:var(--yellow);color:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}

/* FIREBASE BADGE */
.fb-badge{font-size:.75rem;padding:4px 10px;border-radius:20px;font-weight:700;}
.fb-ok{background:#022;color:var(--green);}
.fb-err{background:#200;color:var(--red);}
.fb-connecting{background:#221;color:var(--yellow);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px 20px;}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--card2);border-radius:12px;padding:14px;border:1px solid var(--border);text-align:center;}
.stat-val{font-size:1.8rem;font-weight:900;margin-bottom:4px;}
.stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 320px;gap:0;height:calc(100vh - 135px);}
@media(max-width:900px){.main{grid-template-columns:1fr;}}

/* PANELS */
.panel{border-right:1px solid var(--border);display:flex;flex-direction:column;}
.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#080808;}
.panel-header h2{font-size:.95rem;font-weight:800;}
.panel-body{flex:1;overflow-y:auto;padding:12px;}

/* RIGHT SIDE: Drivers + Log */
.right-col{display:flex;flex-direction:column;}
.right-panel{flex:1;border-bottom:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.right-panel .panel-body{flex:1;overflow-y:auto;padding:10px;}

/* ORDER ROW */
.order-row{display:grid;grid-template-columns:80px 1fr 90px 100px 80px;gap:8px;
  align-items:center;padding:10px 12px;background:var(--card2);border-radius:10px;
  margin-bottom:8px;border:1px solid var(--border);}
.order-id{font-weight:900;color:var(--yellow);font-size:.85rem;}
.order-info{min-width:0;}
.order-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-sub{font-size:.75rem;color:var(--muted);margin-top:2px;}
.order-zone{font-size:.8rem;color:var(--muted);}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap;}
.badge-nouvelle{background:#1a0a00;color:var(--orange);}
.badge-acceptee{background:#0a1a00;color:var(--green);}
.badge-prete{background:#1a1500;color:var(--yellow);}
.badge-en-route{background:#001a1a;color:var(--blue);}
.badge-livree{background:#0a1a0a;color:var(--green);}
.dispatch-btn{background:var(--yellow);color:#000;border:none;padding:5px 10px;
  border-radius:6px;font-weight:700;cursor:pointer;font-size:.75rem;white-space:nowrap;}
.dispatch-btn:disabled{opacity:.3;cursor:default;}

/* DRIVER ROW */
.driver-row{display:flex;gap:10px;align-items:center;padding:10px;
  background:var(--card2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);}
.driver-avatar{font-size:1.6rem;width:38px;text-align:center;}
.driver-info{flex:1;min-width:0;}
.driver-name{font-weight:700;}
.driver-meta{font-size:.75rem;color:var(--muted);margin-top:2px;}
.driver-badge{padding:3px 8px;border-radius:12px;font-size:.72rem;font-weight:700;}
.d-available{background:#022;color:var(--green);}
.d-busy{background:#220;color:var(--orange);}

/* LOG */
.log-item{padding:6px 10px;font-size:.8rem;border-bottom:1px solid var(--border);color:var(--muted);}
.log-item .log-time{color:var(--yellow);margin-right:8px;font-size:.72rem;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<!-- FIREBASE SDK COMPAT -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- TOP BAR -->
<div class="topbar">
  <h1>🚀 ADMIN — TropRapide</h1>
  <div class="topbar-right">
    <span class="fb-badge fb-connecting" id="fb-badge">🔄 Connexion...</span>
    <span class="clock" id="clock"></span>
    <button class="btn btn-yellow" onclick="forceDispatchAll()">⚡ Dispatch Tout</button>
    <button class="btn btn-red" onclick="resetOrders()">🗑️ Reset</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-val" id="s-total" style="color:var(--yellow)">0</div>
    <div class="stat-label">Commandes total</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="s-pending" style="color:var(--orange)">0</div>
    <div class="stat-label">En attente</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="s-enroute" style="color:var(--blue)">0</div>
    <div class="stat-label">En route</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="s-done" style="color:var(--green)">0</div>
    <div class="stat-label">Livrées</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="s-drivers" style="color:var(--green)">0</div>
    <div class="stat-label">Livreurs dispo</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="s-revenue" style="color:var(--yellow)">0</div>
    <div class="stat-label">Revenus (FCFA)</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT: ORDERS -->
  <div class="panel">
    <div class="panel-header">
      <h2>📦 Commandes en temps réel</h2>
      <span id="order-count" style="color:var(--muted);font-size:.8rem;"></span>
    </div>
    <div class="panel-body" id="orders-list">
      <p style="color:var(--muted);text-align:center;margin-top:40px;">Connexion Firebase...</p>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-col">

    <!-- DRIVERS -->
    <div class="right-panel">
      <div class="panel-header">
        <h2>🏍️ Livreurs</h2>
        <span id="driver-count" style="color:var(--muted);font-size:.8rem;"></span>
      </div>
      <div class="panel-body" id="drivers-list">
        <p style="color:var(--muted);text-align:center;margin-top:20px;font-size:.8rem;">Chargement...</p>
      </div>
    </div>

    <!-- DISPATCH LOG -->
    <div class="right-panel" style="max-height:250px;">
      <div class="panel-header">
        <h2>📋 Dispatch Log</h2>
        <button class="btn btn-ghost" style="padding:4px 8px;font-size:.75rem;" onclick="clearLog()">Effacer</button>
      </div>
      <div class="panel-body" id="log-list" style="padding:0;">
        <p style="color:var(--muted);text-align:center;padding:20px;font-size:.8rem;">Log vide</p>
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   FIREBASE CONFIG — même projet que kds.html, driver.html, commande.html
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD0FL4ua8NUWKfwu_gGUL5TI1RkiNbBZnU",
  authDomain: "troprapide-821a7.firebaseapp.com",
  databaseURL: "https://troprapide-821a7-default-rtdb.firebaseio.com",
  projectId: "troprapide-821a7"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

/* ── État local (mis à jour par Firebase onValue) ── */
let allOrders  = {};
let allDrivers = {};
let allLog     = {};

/* ── XSS ── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ── Firebase badge ── */
function setBadge(state){
  const b = document.getElementById('fb-badge');
  b.className = 'fb-badge fb-'+state;
  b.textContent = state==='ok' ? '🔥 Firebase OK' : state==='err' ? '❌ Erreur Firebase' : '🔄 Connexion...';
}

/* ── Log Firebase ── */
function addLog(msg){
  rtdb.ref('/log').push({ time: Date.now(), msg }).catch(()=>{});
}

/* ============================================================
   MOTEUR DE DISPATCH
   score = distance + (charge × 2) - performance
   ============================================================ */
function getDistance(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function findBestDriver(order, drivers){
  let best=null, bestScore=Infinity;
  const excluded = order.declinedBy || [];
  Object.entries(drivers).forEach(([id,d])=>{
    if(d.status !== 'available') return;
    if(excluded.includes(id)) return;
    const oLat = order.lat || 5.340, oLng = order.lng || -4.010;
    const dist = getDistance(oLat, oLng, d.lat||5.340, d.lng||-4.010);
    const load = d.activeOrders || 0;
    const perf = d.speed || 1;
    const score = dist + (load * 2) - perf;
    if(score < bestScore){ bestScore=score; best={id,...d,_dist:dist.toFixed(1),_score:score.toFixed(2)}; }
  });
  return best;
}

window.dispatchOrder = function(orderId){
  const order = allOrders[orderId];
  if(!order) return;
  if(order.assignedTo || order.status === 'livree') return;
  if(order.status !== 'prete' && order.status !== 'declined'){
    addLog(`⚠️ #${orderId.slice(-4)} pas encore prête (statut: ${order.status})`);
    return;
  }

  const best = findBestDriver(order, allDrivers);
  if(!best){
    addLog(`❌ Aucun livreur dispo pour #${orderId.slice(-4)}`);
    return;
  }

  const updates = {};
  updates[`/orders/${orderId}/assignedTo`]    = best.id;
  updates[`/orders/${orderId}/assignedName`]  = best.name;
  updates[`/orders/${orderId}/status`]        = 'attribue';
  updates[`/orders/${orderId}/dispatchedAt`]  = Date.now();
  updates[`/livreurs/${best.id}/status`]        = 'busy';
  updates[`/livreurs/${best.id}/activeOrders`]  = (best.activeOrders||0)+1;
  updates[`/livreurs/${best.id}/currentOrder`]  = orderId;

  rtdb.ref().update(updates)
    .then(()=> addLog(`✅ #${orderId.slice(-4)} → ${best.name} | ${best._dist} km | score ${best._score}`))
    .catch(e=> addLog(`❌ Erreur dispatch: ${e.message}`));
};

function forceDispatchAll(){
  const ready = Object.keys(allOrders).filter(id => allOrders[id].status==='prete' && !allOrders[id].assignedTo);
  if(ready.length === 0){ alert('Aucune commande prête à dispatcher'); return; }
  ready.forEach(id => dispatchOrder(id));
}

/* ── Auto-dispatch watcher ── */
let _lastPrete = new Set();
function autoDispatchWatcher(){
  const toDispatch = Object.keys(allOrders).filter(id => {
    const o = allOrders[id];
    return (o.status === 'prete' || o.status === 'declined') && !o.assignedTo;
  });
  toDispatch.forEach(id => {
    if(!_lastPrete.has(id)){
      _lastPrete.add(id);
      setTimeout(()=>{
        const o = allOrders[id];
        if(!o){ _lastPrete.delete(id); return; }
        const best = findBestDriver(o, allDrivers);
        if(best){
          dispatchOrder(id);
        } else if(o.status === 'declined'){
          // Reset et remettre en file
          rtdb.ref(`/orders/${id}`).update({ status:'prete', declinedBy: [], assignedTo:null, assignedName:null });
          addLog(`⚠️ Aucun livreur dispo pour #${id.slice(-4)} — remis en file`);
        }
        _lastPrete.delete(id);
      }, 1200);
    }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const orders  = allOrders;
  const drivers = allDrivers;
  const log     = allLog;

  /* ---- STATS ---- */
  const all = Object.values(orders);
  document.getElementById('s-total').textContent   = all.length;
  document.getElementById('s-pending').textContent = all.filter(o=>['nouvelle','acceptee','prete','attribue','declined'].includes(o.status)).length;
  document.getElementById('s-enroute').textContent = all.filter(o=>o.status==='en-route').length;
  document.getElementById('s-done').textContent    = all.filter(o=>o.status==='livree').length;
  document.getElementById('s-drivers').textContent = Object.values(drivers).filter(d=>d.status==='available').length;
  const rev = all.filter(o=>o.status==='livree').reduce((s,o)=>s+(Number(o.total||o.amount||0)),0);
  document.getElementById('s-revenue').textContent = rev.toLocaleString('fr');

  /* ---- ORDERS ---- */
  const orderList = document.getElementById('orders-list');
  const ordersSorted = Object.entries(orders).sort((a,b)=> (b[1].createdAt||0)-(a[1].createdAt||0));
  document.getElementById('order-count').textContent = ordersSorted.length + ' commandes';

  if(ordersSorted.length === 0){
    orderList.innerHTML = '<p style="color:var(--muted);text-align:center;margin-top:40px;">Aucune commande dans Firebase</p>';
  } else {
    orderList.innerHTML = ordersSorted.map(([id,o])=>{
      const elapsed = Math.floor((Date.now()-(o.createdAt||Date.now()))/60000);
      const canDispatch = (o.status==='prete' || o.status==='declined') && !o.assignedTo;
      const statusBadge = {
        'nouvelle': `<span class="badge badge-nouvelle">🔴 Nouvelle</span>`,
        'acceptee': `<span class="badge badge-acceptee">🟠 Cuisine</span>`,
        'prete':    `<span class="badge badge-prete">🟡 Prête</span>`,
        'attribue': `<span class="badge badge-en-route">📲 En attente livreur</span>`,
        'declined': `<span class="badge" style="background:#1a0000;color:var(--red);">⛔ Refusée — redispatch…</span>`,
        'en-route': `<span class="badge badge-en-route">🔵 En route</span>`,
        'livree':   `<span class="badge badge-livree">✅ Livrée</span>`
      }[o.status] || `<span class="badge">${esc(o.status)}</span>`;

      return `
      <div class="order-row" style="${canDispatch?'border-color:var(--yellow);':''}">
        <div class="order-id">#${id.slice(-4).toUpperCase()}</div>
        <div class="order-info">
          <div class="order-name">${esc(o.client||o.nom||'Client')}</div>
          <div class="order-sub">${esc(o.items||o.plat||'—')}</div>
          ${o.assignedName ? `<div class="order-sub" style="color:var(--blue)">🏍️ ${esc(o.assignedName)}</div>` : ''}
          ${o.total||o.amount ? `<div class="order-sub" style="color:var(--yellow)">${Number(o.total||o.amount||0).toLocaleString('fr')} FCFA</div>` : ''}
        </div>
        <div class="order-zone">📍 ${esc(o.zone||o.adresse||'—')}<br><span style="color:var(--muted);font-size:.7rem;">${elapsed}min</span></div>
        <div>${statusBadge}</div>
        <div>
          <button class="dispatch-btn" ${canDispatch?'':'disabled'} onclick="dispatchOrder('${id}')">
            ${canDispatch ? '⚡ Dispatch' : (o.assignedTo ? '✓ OK' : '—')}
          </button>
        </div>
      </div>`;
    }).join('');
  }

  /* ---- DRIVERS (/livreurs) ---- */
  const driverList = document.getElementById('drivers-list');
  const driversSorted = Object.entries(drivers).sort((a,b)=> (a[1].name||'').localeCompare(b[1].name||''));
  document.getElementById('driver-count').textContent = driversSorted.length + ' livreurs';

  if(driversSorted.length === 0){
    driverList.innerHTML = '<p style="color:var(--muted);text-align:center;margin-top:20px;font-size:.8rem;">Aucun livreur dans Firebase</p>';
  } else {
    driverList.innerHTML = driversSorted.map(([id,d])=>`
      <div class="driver-row">
        <div class="driver-avatar">${d.avatar||'🏍️'}</div>
        <div class="driver-info">
          <div class="driver-name">${esc(d.name||id)}</div>
          <div class="driver-meta">
            ${d.speed ? `Vitesse: ${d.speed} • ` : ''}Cmd: ${d.activeOrders||0}
            ${d.currentOrder ? ` • #${String(d.currentOrder).slice(-4).toUpperCase()}` : ''}
            ${d.lat ? `<br>📍 ${d.lat.toFixed(3)}, ${d.lng.toFixed(3)}` : ''}
          </div>
        </div>
        <span class="driver-badge ${d.status==='available'?'d-available':'d-busy'}">
          ${d.status==='available'? '🟢 Dispo' : '🟠 Busy'}
        </span>
      </div>
    `).join('');
  }

  /* ---- LOG ---- */
  const logEl = document.getElementById('log-list');
  const logEntries = Object.values(log).sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,80);
  if(logEntries.length === 0){
    logEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;font-size:.8rem;">Log vide</p>';
  } else {
    logEl.innerHTML = logEntries.map(l=>`
      <div class="log-item">
        <span class="log-time">${new Date(l.time).toLocaleTimeString('fr')}</span>${esc(l.msg)}
      </div>`).join('');
  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
function resetOrders(){
  if(!confirm('Supprimer toutes les commandes Firebase ?')) return;
  rtdb.ref('/orders').remove().then(()=> addLog('🗑️ Commandes réinitialisées'));
}

function clearLog(){
  rtdb.ref('/log').remove();
}

/* ============================================================
   BEEP SONORE
   ============================================================ */
let _knownOrderIds = new Set();
function playBeep(){
  try{
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    [[660,0],[880,.2],[1100,.4]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(.5,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.19);
    });
    setTimeout(()=>ctx.close(),800);
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}

/* ============================================================
   FIREBASE LISTENERS EN TEMPS RÉEL
   ============================================================ */
// Écoute des commandes
rtdb.ref('/orders').on('value', snap => {
  setBadge('ok');
  const newOrders = snap.val() || {};

  // Beep si nouvelle commande
  let hasNew = false;
  Object.keys(newOrders).forEach(id => {
    if(!_knownOrderIds.has(id)){ hasNew = true; }
    _knownOrderIds.add(id);
  });
  if(hasNew) playBeep();

  allOrders = newOrders;
  autoDispatchWatcher();
  render();
}, err => {
  setBadge('err');
  console.error('Firebase orders error:', err);
});

// Écoute des livreurs (chemin /livreurs — même que admin.troprapide.com)
rtdb.ref('/livreurs').on('value', snap => {
  allDrivers = snap.val() || {};
  render();
}, err => {
  console.error('Firebase livreurs error:', err);
});

// Écoute du log
rtdb.ref('/log').on('value', snap => {
  allLog = snap.val() || {};
  render();
});

/* ── HORLOGE ── */
setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr'); }, 1000);
</script>
</body>
</html>
